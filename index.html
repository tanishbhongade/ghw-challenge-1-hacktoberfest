<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tip Calculator</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --muted: #94a3b8;
      --text: #f8fafc;
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --input: #0b1220;
      --border: #334155;
      --error: #f87171;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(circle at top right, #14532d 0%, transparent 40%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: min(440px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.6rem;
    }

    p.subtitle {
      margin: 0 0 24px;
      color: var(--muted);
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .field {
      margin-bottom: 18px;
    }

    input[type="number"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--text);
      font-size: 1rem;
    }

    input[type="number"]:focus {
      outline: 2px solid var(--accent);
      border-color: transparent;
    }

    .tips {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .tips button {
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 0;
      cursor: pointer;
      font-weight: 600;
    }

    .tips button.active,
    .tips button:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #052e16;
    }

    .results {
      margin-top: 8px;
      padding: 16px;
      border-radius: 12px;
      background: var(--input);
      border: 1px solid var(--border);
    }

    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .row:last-child {
      margin-bottom: 0;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .value {
      color: var(--accent);
    }

    .error {
      min-height: 1.2em;
      color: var(--error);
      font-size: 0.85rem;
      margin: -8px 0 12px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Tip Calculator</h1>
    <p class="subtitle">Enter the bill, pick a tip, and split if you want.</p>

    <div class="field">
      <label for="bill">Bill amount ($)</label>
      <input id="bill" type="number" min="0" step="0.01" placeholder="0.00" />
    </div>

    <div class="field">
      <label>Tip percent</label>
      <div class="tips" id="tip-buttons">
        <button type="button" data-tip="10">10%</button>
        <button type="button" data-tip="15" class="active">15%</button>
        <button type="button" data-tip="18">18%</button>
        <button type="button" data-tip="20">20%</button>
      </div>
    </div>

    <div class="field">
      <label for="custom-tip">Custom tip (%)</label>
      <input id="custom-tip" type="number" min="0" step="0.1" placeholder="e.g. 22" />
    </div>

    <div class="field">
      <label for="people">Number of people</label>
      <input id="people" type="number" min="1" step="1" value="1" />
    </div>

    <p class="error" id="error"></p>

    <div class="results">
      <div class="row">
        <span>Tip</span>
        <span class="value" id="tip-amount">$0.00</span>
      </div>
      <div class="row">
        <span>Total</span>
        <span class="value" id="total-amount">$0.00</span>
      </div>
      <div class="row">
        <span>Per person</span>
        <span class="value" id="per-person">$0.00</span>
      </div>
    </div>
  </main>

  <script>
    const billInput = document.getElementById("bill");
    const customTipInput = document.getElementById("custom-tip");
    const peopleInput = document.getElementById("people");
    const errorEl = document.getElementById("error");
    const tipButtons = document.querySelectorAll("#tip-buttons button");
    const tipAmountEl = document.getElementById("tip-amount");
    const totalAmountEl = document.getElementById("total-amount");
    const perPersonEl = document.getElementById("per-person");

    let selectedTip = 15;

    function money(n) {
      return "$" + n.toFixed(2);
    }

    function setActiveButton(percent) {
      tipButtons.forEach((btn) => {
        btn.classList.toggle("active", Number(btn.dataset.tip) === percent);
      });
    }

    function calculate() {
      const bill = Number(billInput.value);
      const people = Number(peopleInput.value);
      const customTip = customTipInput.value === "" ? null : Number(customTipInput.value);
      const tipPercent = customTip === null ? selectedTip : customTip;

      if (billInput.value !== "" && (Number.isNaN(bill) || bill < 0)) {
        errorEl.textContent = "Enter a valid bill amount.";
        return;
      }
      if (customTip !== null && (Number.isNaN(customTip) || customTip < 0)) {
        errorEl.textContent = "Enter a valid tip percent.";
        return;
      }
      if (peopleInput.value !== "" && (!Number.isInteger(people) || people < 1)) {
        errorEl.textContent = "Split between at least 1 person.";
        return;
      }

      errorEl.textContent = "";

      const safeBill = Number.isFinite(bill) && bill > 0 ? bill : 0;
      const safePeople = Number.isInteger(people) && people > 0 ? people : 1;
      const tip = safeBill * (tipPercent / 100);
      const total = safeBill + tip;

      tipAmountEl.textContent = money(tip);
      totalAmountEl.textContent = money(total);
      perPersonEl.textContent = money(total / safePeople);
    }

    tipButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        selectedTip = Number(btn.dataset.tip);
        customTipInput.value = "";
        setActiveButton(selectedTip);
        calculate();
      });
    });

    customTipInput.addEventListener("input", () => {
      if (customTipInput.value !== "") {
        setActiveButton(null);
      } else {
        setActiveButton(selectedTip);
      }
      calculate();
    });

    billInput.addEventListener("input", calculate);
    peopleInput.addEventListener("input", calculate);

    calculate();
  </script>
</body>
</html>
